<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>オセロ (Othello / Reversi) - オンライン対戦＆CPU対戦</title>
    <meta name="description" content="モダンでリッチな3D反転演出とAI対戦機能を備えた本格オセロWebアプリケーション">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Outfit:wght@600;800&display=swap" rel="stylesheet">
    <!-- Main Style -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header -->
    <header class="app-header">
        <div style="display: flex; justify-content: flex-end; margin-bottom: 8px;">
            <a href="trig-quiz/index.html" class="btn" style="text-decoration: none; font-size: 0.8rem; padding: 6px 12px;">
                📐 三角比クイズへ ➔
            </a>
        </div>
        <h1 class="app-title">
            <span>✨</span> OTHELLO
        </h1>
        <p class="app-subtitle">リッチな3D反転アニメーション & CPU対戦</p>
    </header>

    <!-- Main Game Section -->
    <main class="game-container">
        <!-- Scoreboard -->
        <section class="scoreboard" aria-label="スコアボード">
            <!-- Player Black -->
            <div id="player-black-card" class="player-card active">
                <div class="player-disc-icon black"></div>
                <div class="player-info">
                    <span class="player-name" id="black-name">あなた (黒)</span>
                    <span class="player-score" id="black-score">2</span>
                    <span class="player-status" id="black-status">あなたの手番</span>
                </div>
            </div>

            <!-- VS Badge -->
            <div class="vs-badge">VS</div>

            <!-- Player White (CPU / 2P) -->
            <div id="player-white-card" class="player-card">
                <div class="player-disc-icon white"></div>
                <div class="player-info">
                    <span class="player-name" id="white-name">CPU (中級)</span>
                    <span class="player-score" id="white-score">2</span>
                    <span class="player-status" id="white-status">待機中</span>
                </div>
            </div>
        </section>

        <!-- Board Wrapper -->
        <section class="board-wrapper" aria-label="オセロ盤">
            <div id="board" class="board">
                <!-- 8x8 cells are dynamically generated by app.js -->
            </div>
        </section>

        <!-- Controls Toolbar -->
        <section class="controls-card" aria-label="ゲーム操作パネル">
            <!-- Mode, Color & Difficulty Selectors -->
            <div class="controls-group">
                <div class="select-wrapper" id="mode-wrapper">
                    <select id="mode-select" class="custom-select" aria-label="対戦モード">
                        <option value="pve" selected>🤖 VS CPU</option>
                        <option value="pvp">👥 2人対戦</option>
                    </select>
                    <span class="select-arrow">▼</span>
                </div>

                <div class="select-wrapper" id="color-wrapper">
                    <select id="color-select" class="custom-select" aria-label="あなたの手番色">
                        <option value="black" selected>⚫ 先手 (黒)</option>
                        <option value="white">⚪ 後手 (白)</option>
                    </select>
                    <span class="select-arrow">▼</span>
                </div>

                <div class="select-wrapper" id="difficulty-wrapper">
                    <select id="difficulty-select" class="custom-select" aria-label="CPU難易度">
                        <option value="easy">初級 (Easy)</option>
                        <option value="normal" selected>中級 (Normal)</option>
                        <option value="hard">上級 (Hard)</option>
                    </select>
                    <span class="select-arrow">▼</span>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="controls-group">
                <button id="btn-undo" class="btn" title="一手戻す" disabled>
                    <span>↩️</span> 待った
                </button>
                <button id="btn-reset" class="btn" title="最初からやり直す">
                    <span>🔄</span> リセット
                </button>
                <button id="btn-guide" class="btn btn-primary" title="置ける場所ガイド">
                    <span>💡</span> ガイド
                </button>
                <button id="btn-sound" class="btn btn-primary" title="効果音切り替え">
                    🔊 サウンド
                </button>
            </div>
        </section>
    </main>

    <!-- Toast Notifications (Pass alert etc.) -->
    <div id="toast-container" class="toast-container" aria-live="polite"></div>

    <!-- Game Over Result Modal -->
    <div id="game-over-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-card">
            <div id="modal-icon" class="modal-icon">🏆</div>
            <h2 id="modal-title" class="modal-title">対局終了</h2>
            <p id="modal-subtitle" class="modal-subtitle">結果の発表です！</p>
            
            <div class="modal-scores">
                <div class="modal-score-item">
                    <span class="modal-score-label">黒 (あなた)</span>
                    <span id="modal-black-score" class="modal-score-val">32</span>
                </div>
                <div class="modal-score-item">
                    <span class="modal-score-label">白 (相手)</span>
                    <span id="modal-white-score" class="modal-score-val">32</span>
                </div>
            </div>

            <div class="modal-actions">
                <button id="modal-btn-restart" class="btn btn-primary">もう一度遊ぶ</button>
                <button id="modal-btn-close" class="btn">盤面を見る</button>
            </div>
        </div>
    </div>

    <!-- Canvas for Victory Confetti -->
    <canvas id="confetti-canvas"></canvas>

    <!-- Scripts -->
    <script src="js/audio.js"></script>
    <script src="js/game.js"></script>
    <script src="js/ai.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
